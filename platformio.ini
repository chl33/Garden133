; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	      secrets.ini
	      local.ini

[node32s]
platform = espressif32
framework = arduino
board = esp32dev # node32s
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
check_tool = clangtidy
monitor_filters = esp32_exception_decoder
build_type = release
extra_scripts = pre:build_svelte.py
lib_deps =
	og3@^0.6.3
	og3x-lora@^0.6.3
	og3x-satellite@^0.6.3
	og3x-shtc3@~0.6.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit SHTC3 Library@^1.0.0
	adafruit/Adafruit Unified Sensor@^1.1.0
	bakercp/CRC32
	bblanchon/ArduinoJson@^7.0.0
	heman/AsyncMqttClient-esphome@^2.1.0
	elims/PsychicMqttClient @ ^0.2.4
	nanopb/Nanopb
	ESP32Async/ESPAsyncWebServer @ 3.6.0
	hoeken/PsychicHttp@^2.1.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
	Wire
	SPI

build_flags =
	${local.build_flags}
	'-Wall'
;	'-D LOG_DEBUG'
;	'-D LOG_METHOD=App::LogType::kSerial'
;	'-D LOG_METHOD=App::LogType::kUdp'
	'-D LOG_METHOD=App::LogType::kNone'
	'-D OTA_PASSWORD="${secrets.otaPassword}"'
;	'-DASYNC_TCP_SSL_ENABLED=1'
lib_ldf_mode = deep+
lib_compat_mode = strict

[usb]
upload_protocol = esptool
upload_port = /dev/ttyUSB0

[wifi]
upload_protocol = espota
upload_flags =
	--auth='${secrets.otaPassword}'
